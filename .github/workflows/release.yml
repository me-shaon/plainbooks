# Publishes a GitHub release for each version tag, for example v0.2.0. Copies of the app
# read the newest release: the in-app update check and update.yml both use it.
# Runs only in the upstream repository. See CONTRIBUTING.md > Releases.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'me-shaon/plainbooks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches package.json
        run: |
          version="$(jq -r .version package.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json has version $version."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
